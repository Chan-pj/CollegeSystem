<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>수강 목록</title>
    <style>
        body { font-family: sans-serif; }
        h2 { text-align: center; }
        .wrap { width: 90%; margin: 0 auto; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0 40px; }
        th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: center; font-size: 14px; }
        th { background-color: #f2f2f2; }
        .top-bar { width: 90%; margin: 20px auto; text-align: right; }
        .top-bar a { text-decoration: none; padding: 8px 16px; border-radius: 4px; margin-left: 6px; font-size: 14px; }
        .btn-main { background: #e0e0e0; color: #333; }
        .btn-add { background: #333; color: white; }
        .empty { text-align: center; margin-top: 50px; color: #888; }
    </style>
</head>
<body>
    <h2>수강 목록</h2>

    <div class="top-bar">
        <a class="btn-main" th:href="@{/}">메인으로</a>
        <a class="btn-add" th:href="@{/courses/new}">+ 수강 신청</a>
    </div>

    <div class="wrap" th:if="${!courses.isEmpty()}">
        <table>
            <tr>
                <th>일련번호</th><th>학번</th><th>학생명</th>
                <th>과목코드</th><th>과목명</th><th>담당교수</th><th>학점</th><th>신청일자</th>
            </tr>
            <tr th:each="c : ${courses}">
                <td th:text="${c.csCiCode}"></td>
                <td th:text="${c.student != null ? c.student.csSiCode : '-'}"></td>
                <td th:text="${c.student != null ? c.student.csSiName : '-'}"></td>
                <td th:text="${c.subject != null ? c.subject.csSjCode : '-'}"></td>
                <td th:text="${c.subject != null ? c.subject.csSjName : '-'}"></td>
                <td th:text="${c.subject != null and c.subject.professor != null ? c.subject.professor.csPiName : '-'}"></td>
                <td th:text="${c.subject != null ? c.subject.csSjUnit : '-'}"></td>
                <td th:text="${c.csCiRdate}"></td>
            </tr>
        </table>
    </div>

    <p class="empty" th:if="${courses.isEmpty()}">수강 신청 내역이 없습니다.</p>
</body>
</html>
