<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강의 시간 목록</title>
    <style>
        body { font-family: sans-serif; }
        h2 { text-align: center; }
        .wrap { width: 90%; margin: 0 auto; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0 40px; }
        th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: center; font-size: 14px; }
        th { background-color: #f2f2f2; }
        .top-bar { width: 90%; margin: 20px auto; text-align: right; }
        .top-bar a { text-decoration: none; padding: 8px 16px; border-radius: 4px; margin-left: 6px; font-size: 14px; }
        .btn-main { background: #e0e0e0; color: #333; }
        .btn-add { background: #333; color: white; }
        .empty { text-align: center; margin-top: 50px; color: #888; }
    </style>
</head>
<body>
    <h2>강의 시간 목록</h2>

    <div class="top-bar">
        <a class="btn-main" th:href="@{/}">메인으로</a>
        <a class="btn-main" th:href="@{/timetables/student}">학생별 시간표</a>
        <a class="btn-add" th:href="@{/timetables/new}">+ 강의 시간 등록</a>
    </div>

    <div class="wrap" th:if="${!timetables.isEmpty()}">
        <table>
            <tr>
                <th>시간표 코드</th><th>요일</th><th>교시</th><th>과목코드</th>
                <th>과목명</th><th>담당교수</th><th>강의실</th><th>개설학기</th>
            </tr>
            <tr th:each="t : ${timetables}">
                <td th:text="${t.csTiCode}"></td>
                <td th:text="${dayNames[t.csTiDay]}"></td>
                <td th:text="${t.csTiStartPeriod} + '~' + ${t.csTiEndPeriod} + '교시'"></td>
                <td th:text="${t.subject.csSjCode}"></td>
                <td th:text="${t.subject.csSjName}"></td>
                <td th:text="${t.subject.professor != null ? t.subject.professor.csPiName : '-'}"></td>
                <td th:text="${t.subject.csSjRoom}"></td>
                <td th:text="${t.subject.csSjTerm}"></td>
            </tr>
        </table>
    </div>

    <p class="empty" th:if="${timetables.isEmpty()}">등록된 강의 시간이 없습니다.</p>
</body>
</html>
