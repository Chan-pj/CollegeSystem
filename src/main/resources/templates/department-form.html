<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학과 정보 입력</title>
    <style>
        body { font-family: sans-serif; }
        h2 { text-align: center; }
        form { width: 420px; margin: 30px auto; display: flex; flex-direction: column; gap: 6px; }
        label { font-weight: bold; margin-top: 8px; }
        input, select { padding: 7px; font-size: 14px; }
        .hint { font-weight: normal; color: #888; font-size: 12px; }
        .notice { text-align: center; color: #888; font-size: 13px; }
        button { margin-top: 16px; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .links { text-align: center; }
    </style>
</head>
<body>
    <h2>학과 정보 입력</h2>
    <p class="notice">학과코드는 등록 시 자동으로 부여됩니다.</p>

    <form th:action="@{/departments/new}" th:object="${department}" method="post">
        <label>학과이름</label>
        <input type="text" th:field="*{csDiDeptName}" maxlength="20" required>

        <label>학과 개설일</label>
        <input type="date" th:field="*{csDiRdate}" required>

        <button type="submit">등록</button>
    </form>

    <div class="links"><a th:href="@{/departments}">학과 목록 보기</a> | <a th:href="@{/}">메인으로</a></div>
</body>
</html>
