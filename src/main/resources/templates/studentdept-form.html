<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학생 소속 학과 등록</title>
    <style>
        body { font-family: sans-serif; }
        h2 { text-align: center; }
        form { width: 420px; margin: 30px auto; display: flex; flex-direction: column; gap: 6px; }
        label { font-weight: bold; margin-top: 8px; }
        input, select { padding: 7px; font-size: 14px; }
        button { margin-top: 16px; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .links { text-align: center; }
    </style>
</head>
<body>
    <h2>학생 소속 학과 등록</h2>
    <p style="text-align:center; color:#888; font-size:13px;">일련번호는 등록 시 자동으로 부여됩니다.</p>

    <form th:action="@{/studentdepts}" th:object="${studentDept}" method="post">
        <label>학생</label>
        <select name="siCode" required>
            <option value="">-- 학생 선택 --</option>
            <option th:each="st : ${students}"
                    th:value="${st.csSiCode}"
                    th:text="${st.csSiCode} + ' - ' + ${st.csSiName}"></option>
        </select>

        <label>학과</label>
        <select name="diCode" required>
            <option value="">-- 학과 선택 --</option>
            <option th:each="dept : ${departments}"
                    th:value="${dept.csDiCode}"
                    th:text="${dept.csDiCode} + ' - ' + ${dept.csDiDeptName}"></option>
        </select>

        <label>입력일자</label>
        <input type="date" th:field="*{csSdRdate}" required>

        <button type="submit">등록</button>
    </form>

    <div class="links"><a th:href="@{/studentdepts}">목록 보기</a> | <a th:href="@{/}">메인으로</a></div>
</body>
</html>
