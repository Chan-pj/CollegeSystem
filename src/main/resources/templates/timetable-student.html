<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학생별 시간표</title>
    <style>
        body { font-family: sans-serif; }
        h2 { text-align: center; }
        .wrap { width: 90%; max-width: 900px; margin: 0 auto; overflow-x: auto; }
        form { text-align: center; margin: 20px 0; }
        select, button { padding: 7px; font-size: 14px; }
        button { background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin: 10px 0 40px; table-layout: fixed; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: center; font-size: 13px; height: 28px; }
        th { background-color: #f2f2f2; }
        td.filled { background: #e8eefc; font-weight: bold; }
        .period { width: 60px; background: #fafafa; }
        .links { text-align: center; }
        .empty { text-align: center; color: #888; }
    </style>
</head>
<body>
    <h2>학생별 시간표</h2>

    <form th:action="@{/timetables/student}" method="get">
        <select name="siCode" required>
            <option value="">-- 학생 선택 --</option>
            <option th:each="st : ${students}"
                    th:value="${st.csSiCode}"
                    th:selected="${st.csSiCode == siCode}"
                    th:text="${st.csSiCode} + ' - ' + ${st.csSiName}"></option>
        </select>
        <button type="submit">조회</button>
    </form>

    <div class="wrap" th:if="${siCode != null}">
        <table>
            <tr>
                <th class="period">교시</th>
                <th th:each="d : ${#numbers.sequence(1, 6)}" th:text="${dayNames[d]}"></th>
            </tr>
            <tr th:each="p : ${#numbers.sequence(1, maxPeriod)}">
                <td class="period" th:text="${p}"></td>
                <td th:each="d : ${#numbers.sequence(1, 6)}"
                    th:classappend="${grid[p][d] != null} ? 'filled'"
                    th:text="${grid[p][d]}"></td>
            </tr>
        </table>
    </div>
    <p class="empty" th:if="${siCode == null}">학생을 선택하면 수강 신청한 과목의 시간표가 표시됩니다.</p>

    <div class="links"><a th:href="@{/timetables}">강의 시간 목록</a> | <a th:href="@{/}">메인으로</a></div>
</body>
</html>
