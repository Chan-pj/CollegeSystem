<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강의 시간 등록</title>
    <style>
        body { font-family: sans-serif; }
        h2 { text-align: center; }
        form { width: 440px; margin: 20px auto; display: flex; flex-direction: column; gap: 6px; }
        label { font-weight: bold; margin-top: 8px; }
        input, select { padding: 7px; font-size: 14px; }
        .hint { font-weight: normal; color: #888; font-size: 12px; }
        .notice { text-align: center; color: #888; font-size: 13px; }
        .error { text-align: center; color: #c0392b; font-size: 14px; }
        button { margin-top: 16px; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .links { text-align: center; }
    </style>
</head>
<body    <h2>강의 시간 등록</h2>
    <p class="notice">과목별 요일/교시를 등록합니다. 학생 시간표는 수강 신청 내역으로 자동 구성됩니다.</p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/timetables}" method="post">
        <label>과목</label>
        <select name="sjCode" required>
            <option value="">-- 과목 선택 --</option>
            <option th:each="sj : ${subjects}"
                    th:value="${sj.csSjCode}"
                    th:text="${sj.csSjCode} + ' - ' + ${sj.csSjName} + ' (' + ${sj.csSjRoom} + ')'"></option>
        </select>

        <label>요일</label>
        <select name="day" required>
            <option th:each="d : ${#numbers.sequence(1, 6)}" th:value="${d}" th:text="${dayNames[d]} + '요일'"></option>
        </select>

        <label>시작 교시</label>
        <select name="startPeriod" required>
            <option th:each="p : ${#numbers.sequence(1, maxPeriod)}" th:value="${p}" th:text="${p} + '교시'"></option>
        </select>

        <label>종료 교시</label>
        <select name="endPeriod" required>
            <option th:each="p : ${#numbers.sequence(1, maxPeriod)}" th:value="${p}" th:text="${p} + '교시'"></option>
        </select>

        <button type="submit">등록</button>
    </form>



    <div class="links"><a th:href="@{/timetables}">강의 시간 목록 보기</a> | <a th:href="@{/}">메인으로</a></div>
</body>
</html>
