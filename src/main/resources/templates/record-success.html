<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>등록 완료</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 100px; }
        .btn-row { display: flex; justify-content: center; gap: 10px; margin-top: 24px; }
        .btn { text-decoration: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        .btn-dark { background: #333; color: white; }
        .btn-light { background: #e0e0e0; color: #333; }
    </style>
</head>
<body>
    <h2>성적이 입력되었습니다 ✅</h2>
    <div class="btn-row">
        <a class="btn btn-light" href="/records/new">다른 성적 입력하기</a>
        <a class="btn btn-light" href="/records">성적 목록 보기</a>
        <a class="btn btn-dark" href="/">메인으로</a>
    </div>
</body>
</html>
