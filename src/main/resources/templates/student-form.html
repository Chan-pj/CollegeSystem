<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학생 정보 입력</title>
    <style>
        body { font-family: sans-serif; }
        h2 { text-align: center; }
        form { width: 420px; margin: 30px auto; display: flex; flex-direction: column; gap: 6px; }
        label { font-weight: bold; margin-top: 8px; }
        input, select { padding: 7px; font-size: 14px; }
        .hint { font-weight: normal; color: #888; font-size: 12px; }
        .notice { text-align: center; color: #888; font-size: 13px; }
        button { margin-top: 16px; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .links { text-align: center; }
    </style>
</head>
<body>
    <h2>학생 정보 입력</h2>
    <p class="notice">학번은 등록 시 자동으로 부여됩니다.</p>

    <form th:action="@{/students/new}" th:object="${student}" method="post">
        <label>이름</label>
        <input type="text" th:field="*{csSiName}" maxlength="20" required>

        <label>입학연도</label>
        <input type="date" th:field="*{csSiEntryYear}" required>

        <label>생년월일</label>
        <input type="date" th:field="*{csSiBirth}" required>

        <label>주소</label>
        <input type="text" th:field="*{csSiAddr}" maxlength="100">

        <label>학년</label>
        <select th:field="*{csSiGrade}">
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
            <option value="4">4학년</option>
        </select>

        <label>성별</label>
        <select th:field="*{csSiGender}">
            <option value="M">남</option>
            <option value="F">여</option>
        </select>

        <label>전화번호</label>
        <input type="text" th:field="*{csSiPhoneNum}" maxlength="20">

        <label>이메일</label>
        <input type="email" th:field="*{csSiEmail}" maxlength="40">

        <label>졸업여부 <span class="hint">(예: Y 또는 N)</span></label>
        <select th:field="*{csSiStatus}">
            <option value="N">N (재학)</option>
            <option value="Y">Y (졸업)</option>
        </select>

        <button type="submit">등록</button>
    </form>

    <div class="links"><a th:href="@{/students}">학생 목록 보기</a> | <a th:href="@{/}">메인으로</a></div>
</body>
</html>
