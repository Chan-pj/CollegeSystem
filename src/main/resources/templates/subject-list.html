<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>과목 목록</title>
    <style>
        body { font-family: sans-serif; }
        h2 { text-align: center; }
        table { border-collapse: collapse; width: 90%; margin: 30px auto; }
        th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: center; font-size: 14px; }
        th { background-color: #f2f2f2; }
        .top-bar { width: 90%; margin: 20px auto; text-align: right; }
        .top-bar a { text-decoration: none; background: #333; color: white; padding: 8px 16px; border-radius: 4px; margin-left: 6px; }
        .empty { text-align: center; margin-top: 50px; color: #888; }
    </style>
</head>
<body>
    <h2>과목 목록</h2>

    <div class="top-bar">
        <a th:href="@{/}">메인으로</a>
        <a th:href="@{/subjects/new}">+ 과목 등록</a>
    </div>

    <table th:if="${!subjects.isEmpty()}">
        <tr>
            <th>과목코드</th>
            <th>과목명</th>
            <th>담당교수</th>
            <th>개설학과</th>
            <th>개설일자</th>
            <th>학점</th>
            <th>전공여부</th>
            <th>강의실</th>
            <th>정원</th>
            <th>개설학기</th>
        </tr>
        <tr th:each="s : ${subjects}">
            <td th:text="${s.csSjCode}"></td>
            <td th:text="${s.csSjName}"></td>
            <td th:text="${s.professor != null ? s.professor.csPiName : '-'}"></td>
            <td th:text="${s.department != null ? s.department.csDiDeptName : '-'}"></td>
            <td th:text="${s.csSjRdate}"></td>
            <td th:text="${s.csSjUnit}"></td>
            <td th:switch="${s.csSjMajor}">
                <span th:case="'1'">전공필수</span>
                <span th:case="'2'">전공선택</span>
                <span th:case="'3'">비전공필수</span>
                <span th:case="'4'">비전공선택</span>
                <span th:case="*">-</span>
            </td>
            <td th:text="${s.csSjRoom}"></td>
            <td th:text="${s.csSjCount}"></td>
            <td th:text="${s.csSjTerm}"></td>
        </tr>
    </table>

    <p class="empty" th:if="${subjects.isEmpty()}">등록된 과목이 없습니다.</p>
</body>
</html>
